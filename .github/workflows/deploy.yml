
name: Data Leak Risk Prediction CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: |
          python -m compileall -q app.py train.py predict.py
          echo "Python validation successful"

      - name: Validate ML model files
        run: |
          python -c "import joblib; joblib.load('models/risk_model.pkl'); joblib.load('models/label_encoder.pkl'); print('ML model validation successful')"

      - name: Deploy to Render
        if: success() && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
